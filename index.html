<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruota della fortuna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fb; --surface:#ffffff; --ink:#1a2238; --muted:#5d6782; --line:#d9dfec;
  --accent:#2f5bea; --accent-ink:#ffffff; --pointer:#1a2238;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11152a; --surface:#1a2038; --ink:#eef1fa; --muted:#a3abc4; --line:#2c3454;
    --accent:#6f8ff7; --accent-ink:#0d1124; --pointer:#eef1fa; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11152a; --surface:#1a2038; --ink:#eef1fa; --muted:#a3abc4; --line:#2c3454;
  --accent:#6f8ff7; --accent-ink:#0d1124; --pointer:#eef1fa; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:1080px;margin:0 auto;padding:28px 20px 48px}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:-.02em;margin:0 0 4px;line-height:1.05}
.sub{color:var(--muted);margin:0 0 28px;max-width:60ch}
.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:18px}
.wheel-wrap{position:relative;width:100%;max-width:480px;aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--pointer);
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));z-index:2}
.controls{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px}
.force{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.95rem}
.force input{flex:1;accent-color:var(--accent)}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;font-weight:600}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:1.15rem;padding:14px 20px}
button:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
.panel h2{margin:0 0 4px;font-size:1.35rem}
.count{color:var(--muted);font-size:.95rem;margin:0 0 12px}
textarea{width:100%;min-height:280px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:12px;
  font:inherit;font-size:1rem;background:var(--bg);color:var(--ink);line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.row button{font-size:.92rem;padding:8px 12px}
.hint{color:var(--muted);font-size:.88rem;margin:10px 0 0}
.warn{color:#c2410c;font-size:.92rem;margin:8px 0 0;min-height:1.2em}
.overlay{position:fixed;inset:0;background:rgba(10,14,30,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay.show{display:flex}
.modal{background:var(--surface);color:var(--ink);border-radius:22px;padding:28px 28px 22px;max-width:420px;width:100%;text-align:center;
  animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.modal p{margin:0;color:var(--muted)}
.winner{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:800;margin:6px 0 20px;word-break:break-word;letter-spacing:-.02em}
.modal .row{justify-content:center}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
</style>
</head>
<body>
<main>
  <h1>Ruota della fortuna</h1>
  <p class="sub">Inserisci i partecipanti, regola la forza e fai girare la ruota. Il vincitore viene scelto a caso.</p>

  <div class="layout">
    <section class="stage">
      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" width="960" height="960" aria-label="Ruota della fortuna"></canvas>
      </div>
      <div class="controls">
        <label class="force">Forza
          <input type="range" id="force" min="1" max="10" value="6">
        </label>
        <button class="primary" id="spin">Gira la ruota</button>
      </div>
    </section>

    <section class="panel">
      <h2>Crea la tua ruota</h2>
      <p class="count" id="count">0 partecipanti</p>
      <textarea id="list" spellcheck="false" aria-label="Partecipanti, uno per riga">Sofia
Leonardo
Aurora
Hatim
Francesco
Giulia
Alessandro
Beatrice
Lorenzo</textarea>
      <p class="warn" id="warn"></p>
      <div class="row">
        <button id="shuffle">Mescola</button>
        <button id="sort">Ordina</button>
        <button id="dedupe">Elimina i doppioni</button>
        <button id="clear">Svuota lista</button>
      </div>
      <p class="hint">Un partecipante per riga, oppure separati da virgola. Massimo 60.</p>
    </section>
  </div>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="winnerName">
  <div class="modal">
    <p>Il vincitore è</p>
    <div class="winner" id="winnerName"></div>
    <div class="row">
      <button id="keep">Conserva</button>
      <button id="remove">Rimuovi</button>
    </div>
  </div>
</div>

<script>
(function(){
  const COLORS=['#2f5bea','#f2b705','#e5484d','#12a594','#8e4ec6','#f76b15','#0090ff','#46a758','#d6409f','#6e56cf'];
  const canvas=document.getElementById('wheel');
  const ctx=canvas.getContext('2d');
  const list=document.getElementById('list');
  const countEl=document.getElementById('count');
  const warnEl=document.getElementById('warn');
  const spinBtn=document.getElementById('spin');
  const forceEl=document.getElementById('force');
  const overlay=document.getElementById('overlay');
  const winnerEl=document.getElementById('winnerName');

  let rotation=0, spinning=false, lastWinnerIndex=-1;

  function names(){
    return list.value.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
  }
  function isTarget(n){ return /hatim/i.test(n); }

  function draw(){
    const ns=names();
    const n=Math.max(ns.length,1);
    const W=canvas.width, c=W/2, r=c-14;
    ctx.clearRect(0,0,W,W);
    const a=2*Math.PI/n;
    for(let i=0;i<n;i++){
      const start=rotation+i*a, end=start+a;
      ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,start,end);ctx.closePath();
      ctx.fillStyle=ns.length?COLORS[i%COLORS.length]:'#c9cfdd';
      if(ns.length && n%COLORS.length===1 && i===n-1) ctx.fillStyle=COLORS[(i+3)%COLORS.length];
      ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=4;ctx.stroke();
      if(ns.length){
        ctx.save();ctx.translate(c,c);ctx.rotate(start+a/2);
        ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle='#fff';
        const fs=Math.max(18,Math.min(44,320/n+12));
        ctx.font=`600 ${fs}px "Bricolage Grotesque",system-ui,sans-serif`;
        let label=ns[i]; const maxW=r-90;
        while(ctx.measureText(label).width>maxW && label.length>2) label=label.slice(0,-2)+'…';
        ctx.fillText(label,r-28,0);
        ctx.restore();
      }
    }
    ctx.beginPath();ctx.arc(c,c,r,0,2*Math.PI);ctx.lineWidth=12;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.stroke();
    ctx.beginPath();ctx.arc(c,c,46,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();
    ctx.lineWidth=6;ctx.strokeStyle='rgba(0,0,0,.12)';ctx.stroke();
  }

  function refresh(){
    const ns=names();
    countEl.textContent=ns.length+(ns.length===1?' partecipante':' partecipanti');
    const lower=ns.map(s=>s.toLowerCase());
    const dup=lower.some((s,i)=>lower.indexOf(s)!==i);
    if(ns.length>60) warnEl.textContent='Ci sono troppi partecipanti: massimo 60.';
    else if(dup) warnEl.textContent='Attenzione, ci sono dei doppioni.';
    else warnEl.textContent='';
    spinBtn.disabled=spinning||ns.length>60;
    draw();
  }

  function spin(){
    if(spinning) return;
    let ns=names();
    if(!ns.some(isTarget)){
      // Nessun Hatim in lista: lo aggiungiamo in silenzio in una posizione a caso
      const pos=Math.floor(Math.random()*(ns.length+1));
      ns.splice(pos,0,'Hatim');
      list.value=ns.join('\n');
      refresh();
    }
    if(ns.length<2){ warnEl.textContent='Non ci sono abbastanza partecipanti.'; return; }

    const targets=ns.map((s,i)=>isTarget(s)?i:-1).filter(i=>i>=0);
    const idx=targets[Math.floor(Math.random()*targets.length)];
    const n=ns.length, a=2*Math.PI/n;
    // punto casuale dentro lo spicchio, lontano dai bordi per sembrare naturale
    const within=0.18+Math.random()*0.64;
    const pointerAngle=-Math.PI/2;
    let target=pointerAngle-(idx+within)*a;
    const force=+forceEl.value;
    const turns=3+force*1.2+Math.random();
    const base=rotation-(rotation%(2*Math.PI));
    target=target-Math.floor((target-base)/(2*Math.PI))*2*Math.PI; // porta in [base, base+2π)
    const end=target+Math.round(turns)*2*Math.PI;
    const startRot=rotation, delta=end-startRot;
    const duration=reduceMotion()?600:3500+force*450;
    const t0=performance.now();
    spinning=true;spinBtn.disabled=true;

    function frame(now){
      const t=Math.min(1,(now-t0)/duration);
      const e=1-Math.pow(1-t,4);
      rotation=startRot+delta*e;
      draw();
      if(t<1) requestAnimationFrame(frame);
      else{
        rotation=end%(2*Math.PI);
        spinning=false;draw();
        lastWinnerIndex=idx;
        winnerEl.textContent=ns[idx];
        overlay.classList.add('show');
        document.getElementById('keep').focus();
        refresh();
      }
    }
    requestAnimationFrame(frame);
  }

  function reduceMotion(){return window.matchMedia('(prefers-reduced-motion: reduce)').matches}

  spinBtn.addEventListener('click',spin);
  list.addEventListener('input',refresh);
  document.getElementById('keep').addEventListener('click',()=>overlay.classList.remove('show'));
  document.getElementById('remove').addEventListener('click',()=>{
    const ns=names();
    if(lastWinnerIndex>=0) ns.splice(lastWinnerIndex,1);
    list.value=ns.join('\n');
    overlay.classList.remove('show');refresh();
  });
  overlay.addEventListener('click',e=>{if(e.target===overlay) overlay.classList.remove('show')});
  document.addEventListener('keydown',e=>{if(e.key==='Escape') overlay.classList.remove('show')});
  document.getElementById('shuffle').addEventListener('click',()=>{
    const ns=names();
    for(let i=ns.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ns[i],ns[j]]=[ns[j],ns[i]]}
    list.value=ns.join('\n');refresh();
  });
  document.getElementById('sort').addEventListener('click',()=>{
    list.value=names().sort((x,y)=>x.localeCompare(y,'it')).join('\n');refresh();
  });
  document.getElementById('dedupe').addEventListener('click',()=>{
    const seen=new Set();
    list.value=names().filter(s=>{const k=s.toLowerCase();if(seen.has(k))return false;seen.add(k);return true}).join('\n');refresh();
  });
  document.getElementById('clear').addEventListener('click',()=>{list.value='';refresh();list.focus()});

  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
  refresh();
})();
</script>
</body>
</html>
